name: Postagem no Telegram a cada 8 min

on:
  schedule:
    - cron: "*/20 * * * *"  # fallback -- o GitHub atrasa cron muito frequente, então o
                             # disparo de verdade a cada 8 min vem de fora (cron-job.org
                             # chamando workflow_dispatch, que não sofre esse atraso)
  workflow_dispatch: {}      # disparado pelo cron-job.org a cada 8 min, e manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Postar produto novo no grupo/canal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_to_telegram.py

      - name: Salvar progresso (produtos já postados)
        run: |
          git config user.name "shopee-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_ids.json data/log_postagens.json data/manual_products.json
          git diff --cached --quiet || git commit -m "chore: registra postagens do dia"
          git pull --rebase --autostash origin master
          git push
