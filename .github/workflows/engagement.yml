name: Mensagem de interação no Telegram

on:
  schedule:
    - cron: "0 12 * * *"  # todo dia, 09:00 (Brasília, UTC-3)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mandar saudação do dia (+ especial de sábado)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/post_engagement_message.py

      - name: Salvar progresso (caso tenha postado especial de sábado)
        run: |
          git config user.name "shopee-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posted_ids.json data/log_postagens.json
          git diff --cached --quiet || git commit -m "chore: mensagem de interação do dia"
          git pull --rebase --autostash origin master
          git push
