name: Renovar catálogo de produtos

on:
  schedule:
    - cron: "0 9 * * *"  # todo dia, 06:00 (Brasília, UTC-3)
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar produtos em alta por nicho
        env:
          SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
          SHOPEE_AFFILIATE_SECRET: ${{ secrets.SHOPEE_AFFILIATE_SECRET }}
        run: python scripts/find_products.py

      - name: Atualizar relatório de cliques que geraram venda
        env:
          SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
          SHOPEE_AFFILIATE_SECRET: ${{ secrets.SHOPEE_AFFILIATE_SECRET }}
        run: python scripts/fetch_sales_report.py

      - name: Reforçar nichos que já provaram vender
        run: python scripts/boost_winning_niches.py
        env:
          SHOPEE_AFFILIATE_APP_ID: ${{ secrets.SHOPEE_AFFILIATE_APP_ID }}
          SHOPEE_AFFILIATE_SECRET: ${{ secrets.SHOPEE_AFFILIATE_SECRET }}

      - name: Separar os 4 produtos do dia pra conteúdo (carrossel Sophia)
        run: python scripts/generate_content_brief.py

      - name: Salvar catálogo, relatório e briefing atualizados
        run: |
          git config user.name "shopee-autopilot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/catalogo_produtos.json data/relatorio_vendas.json data/content_brief_hoje.json data/content_brief_used.json
          git diff --cached --quiet || git commit -m "chore: renova catálogo, relatório de vendas e briefing de conteúdo"
          git pull --rebase --autostash origin master
          git push
